version: '3.8'

services:
  # ==============================================================================
  # SQL Server 2022 Database Engine
  # ==============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: uabindia_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in environment}
      - MSSQL_PID=Standard
      - MSSQL_MEMORY_LIMIT_MB=${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    ports:
      - "127.0.0.1:1433:1433"
    mem_limit: 2500m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${DB_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - uabindia_internal

  # ==============================================================================
  # Redis 7 In-Memory Cache & Session Store
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: uabindia_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - uabindia_internal

  # ==============================================================================
  # Backend API (.NET 10 Web API)
  # ==============================================================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: uabindia_backend
    restart: always
    mem_limit: 1200m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Storage__LocalBasePath=/app/uploads
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UabIndia_Enterprise;User Id=sa;Password=${DB_PASSWORD:?DB_PASSWORD must be set in environment};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True;
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}
      - Jwt__Key=${JWT_KEY:?JWT_KEY must be set in environment}
      - Jwt__Issuer=UabIndia_Api
      - Jwt__Audience=UabIndia_Client
      - Jwt__AccessTokenMinutes=15
      - Jwt__RefreshTokenDays=30
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in environment}
    networks:
      - uabindia_internal

  # ==============================================================================
  # Dedicated Background Worker (.NET 10 Hangfire Server)
  # ==============================================================================
  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.worker
    container_name: uabindia_worker
    restart: always
    mem_limit: 800m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Storage__LocalBasePath=/app/uploads
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UabIndia_Enterprise;User Id=sa;Password=${DB_PASSWORD:?DB_PASSWORD must be set in environment};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True;
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment}
    networks:
      - uabindia_internal

  # ==============================================================================
  # Frontend Web App (Next.js 15 Standalone - Full ERP Suite)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uabindia_frontend
    restart: always
    mem_limit: 1200m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000/api/v1
      - NEXT_PUBLIC_WS_URL=http://backend:5000/hubs/notifications
    networks:
      - uabindia_internal

  # ==============================================================================
  # HRMS Specialized Web Portal (Vite React + Nginx)
  # ==============================================================================
  hrms:
    build:
      context: ./frontend-hrms
      dockerfile: Dockerfile
    container_name: uabindia_hrms
    restart: always
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    networks:
      - uabindia_internal

  # ==============================================================================
  # Nginx Reverse Proxy & Load Balancer
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: uabindia_nginx
    restart: always
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
      - frontend
      - hrms
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - uabindia_internal

volumes:
  mssql_data:
    name: uabindia_mssql_data
  redis_data:
    name: uabindia_redis_data

networks:
  uabindia_internal:
    name: uabindia_internal_network
    driver: bridge

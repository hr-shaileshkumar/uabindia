version: '3.8'

x-backend: &backend
  build:
    context: ./Backend
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:5000
    ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=UabIndia_HRMS;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=true"
    Jwt__Key: "your-secure-jwt-key-minimum-64-characters-long-here"
    Jwt__Issuer: "https://api.uabindia.in"
    Jwt__Audience: "uabindia_clients"
  depends_on:
    sqlserver:
      condition: service_healthy
  networks:
    - erp_cluster_network
  restart: always

x-frontend: &frontend
  build:
    context: ./frontend
    dockerfile: Dockerfile
  environment:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: http://loadbalancer/api/v1
  networks:
    - erp_cluster_network
  restart: always

services:
  loadbalancer:
    image: nginx:1.25-alpine
    container_name: erp_loadbalancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
      - frontend1
      - frontend2
    networks:
      - erp_cluster_network
    restart: always

  backend1:
    <<: *backend
    container_name: erp_backend_1

  backend2:
    <<: *backend
    container_name: erp_backend_2

  backend3:
    <<: *backend
    container_name: erp_backend_3

  backend4:
    <<: *backend
    container_name: erp_backend_4

  frontend1:
    <<: *frontend
    container_name: erp_frontend_1

  frontend2:
    <<: *frontend
    container_name: erp_frontend_2

  redis_cache:
    image: redis:7-alpine
    container_name: erp_redis_cache
    command: redis-server --requirepass RedisClusterPass2026! --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - erp_cluster_network
    restart: always

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourSecurePassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourSecurePassword123!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_cluster_network
    restart: always

networks:
  erp_cluster_network:
    driver: bridge

# ==============================================================================
# UabIndia SaaS ERP - Production Nginx Reverse Proxy & Load Balancer
# Supports Wildcard Multi-Tenant Subdomains (*.uabindia.com) & High-Concurrency
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning & I/O Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15;
    send_timeout 15;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        application/xhtml+xml
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/javascript;

    # DDoS & Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Backend API
    upstream backend_api {
        server api:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Upstream Frontend Next.js
    upstream frontend_web {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Main HTTP Server
    server {
        # Supports any base domain (e.g. *.uabindia.com, *.uabindia.in, custom domain)
        server_name ~^(?<subdomain>[a-zA-Z0-9-]+)\.(?<domain>[a-zA-Z0-9.-]+)$ uabindia.com uabindia.in localhost 127.0.0.1 _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Powered-By "UabIndia ERP Enterprise" always;

        limit_conn conn_limit 100;

        # Backend REST API Routes
        location /api/ {
            limit_req zone=api_rate_limit burst=30 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;

            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        # Auth Endpoints (Strict Rate-Limiting)
        location /api/v1/auth/ {
            limit_req zone=auth_rate_limit burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;
        }

        # Health Probe
        location /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Next.js Static Optimization Cache
        location /_next/static/ {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js Application Frontend
        location / {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;
        }
    }
}

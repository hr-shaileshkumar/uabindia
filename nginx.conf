# High-Concurrency Nginx Reverse Proxy & Load Balancer Configuration
# Engineered for 200,000 Active Concurrent User Capacity

user nginx;
worker_processes auto;
worker_rlimit_nofile 131072;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning & I/O Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip & Brotli Response Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Rate Limiting Zones (DDoS Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:20m;

    # Upstream Backend Cluster (Least Connections Load Balancing)
    upstream backend_erp_cluster {
        least_conn;
        server backend1:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend2:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend3:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend4:5000 max_fails=3 fail_timeout=10s weight=1;
        keepalive 512;
    }

    # Upstream Frontend Cluster
    upstream frontend_erp_cluster {
        least_conn;
        server frontend1:3000 max_fails=3 fail_timeout=10s weight=1;
        server frontend2:3000 max_fails=3 fail_timeout=10s weight=1;
        keepalive 256;
    }

    # Main HTTP/2 Server Proxy
    server {
        listen 80;
        listen [::]:80;
        server_name erp.uabindia.com localhost;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Served-By "Nginx-LoadBalancer-200K" always;

        # Connection Limit per IP
        limit_conn addr_limit 500;

        # API Proxy Route
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://backend_erp_cluster;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Auth Rate-Limited Route
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_erp_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger API Documentation Route
        location /swagger {
            proxy_pass http://backend_erp_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend Application Proxy Route
        location / {
            proxy_pass http://frontend_erp_cluster;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Asset Cache Route
        location /_next/static/ {
            proxy_pass http://frontend_erp_cluster;
            proxy_http_version 1.1;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

services:
  - type: web
    name: uabindia-api
    runtime: docker
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5000
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: https://api.uabindia.in
      - key: Jwt__Audience
        value: uabindia_clients
      - key: Encryption__Key
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__AllowedOrigins
        value: https://app.uabindia.in
      - key: ApplicationInsights__ConnectionString
        sync: false
      - key: Sentry__Dsn
        sync: false
